<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><title>Marco de prueba</title>
<style>body{margin:0;background:#888}iframe{display:block;border:0}</style></head>
<body><script>
const p = new URLSearchParams(location.search);
const f = document.createElement("iframe");
f.width = p.get("w") || "360"; f.height = p.get("h") || "1500";
f.src = "./tabla.html?" + (p.get("q") || "");
document.body.appendChild(f);
f.addEventListener("load", () => setTimeout(() => {
  const d = f.contentDocument;
  const sx = Number(p.get("sx") || 0);
  const box = d.querySelector(".od-ctable__scroll");
  if (box && sx) box.scrollLeft = sx;
  const wide = [...d.querySelectorAll("body *")].filter((e) => e.getBoundingClientRect().right > f.contentWindow.innerWidth + 1 && !e.closest(".od-ctable__scroll")).slice(0, 12).map((e) => e.tagName + "." + e.className + ":" + Math.round(e.getBoundingClientRect().right));
  document.body.dataset.wide = wide.join(" | ");
  document.title = "docW=" + d.documentElement.scrollWidth + " winW=" + f.contentWindow.innerWidth + (box ? " boxScroll=" + box.scrollWidth + "/" + box.clientWidth : "");
}, 2500));
</script></body></html>
