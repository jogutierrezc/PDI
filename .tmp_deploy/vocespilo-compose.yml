services:
  voicebox:
    build: .
    restart: unless-stopped
    volumes:
      - ./output:/app/data/generations
      - voicebox-data:/app/data
      - huggingface-cache:/home/voicebox/.cache/huggingface
    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    networks:
      - voicebox-net
      - dfghn4pk53yzqkipnzracsjx
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  vocespilo-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - voicebox
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80;
          client_max_body_size 500M;
          location = /vocespilo {
            return 301 /vocespilo/;
          }
          location /vocespilo/ {
            proxy_pass http://voicebox:17493/;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header X-Forwarded-Host $$host;
            proxy_set_header X-Forwarded-Prefix /vocespilo;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$http_connection;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/css;
            sub_filter 'href="/' 'href="/vocespilo/';
            sub_filter 'src="/' 'src="/vocespilo/';
            sub_filter '<head>' '<head><script>try{var k=localStorage.getItem("voicebox-server");var d=JSON.parse(k||"null");if(!d||!d.state||!d.state.serverUrl||d.state.serverUrl===location.origin){d=d||{state:{},version:0};d.state.serverUrl=location.origin+"/vocespilo";localStorage.setItem("voicebox-server",JSON.stringify(d));}}catch(e){}</script>';
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
    networks:
      - dfghn4pk53yzqkipnzracsjx
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.vocespilo.rule=Host(`planeacion.udes.edu.co`) && PathPrefix(`/vocespilo`)
      - traefik.http.routers.vocespilo.entryPoints=https
      - traefik.http.routers.vocespilo.tls=true
      - traefik.http.routers.vocespilo.tls.certresolver=letsencrypt
      - traefik.http.services.vocespilo.loadbalancer.server.port=80
      - traefik.docker.network=coolify

networks:
  voicebox-net:
    driver: bridge
  dfghn4pk53yzqkipnzracsjx:
    name: dfghn4pk53yzqkipnzracsjx
    external: true
  coolify:
    name: coolify
    external: true

volumes:
  voicebox-data:
  huggingface-cache:
