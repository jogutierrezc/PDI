/* =====================================================================================================
   Video: Guía del Gestor · Informe de Gestión 2026.
   Cada animación está atada a una FRASE de la narración, no a un segundo: T("04","para entrar") busca esa frase en
   la transcripción de la voz (timing.js). Con una voz nueva se corre audio.py y se vuelve a renderizar; nada más.
   ===================================================================================================== */
const E = "power4.out";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TM = window.TIMING;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const WS = TM.palabras.map(([w, s, e]) => ({ n: norm(w), s, e })).filter(w => w.n);
function lev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 1) return 9; const d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
const same = (a, b) => a === b || (a.length >= 5 && b.length >= 5 && lev(a, b) <= 1);
const words = p => p.split(/\s+/).map(norm).filter(Boolean);
function find(ws, from, to, skip = 0) {
  let seen = 0;
  for (let i = from; i <= to - ws.length; i++) { let ok = true; for (let k = 0; k < ws.length; k++) if (!same(WS[i + k].n, ws[k])) { ok = false; break; } if (ok && seen++ >= skip) return i; }
  return -1;
}
window.__avisos = [];

/* ---------- inicio de cada escena: primera frase de la narración ---------- */
const INI = { "01": "bienvenido al informe de gestion", "02": "el informe de gestion recoge", "03": "existen cuatro papeles", "04": "para entrar abra el menu", "05": "las secciones de texto como", "06": "la alineacion estrategica se trabaja", "07": "en resultados por dimension se", "08": "hay tres maneras de cargar", "09": "cuando varios equipos de su", "10": "cuando los libros regresan se", "11": "hay un caso en el que", "12": "en recibir suba los libros", "13": "antes de enviar revise el", "14": "planeacion o la unidad de", "15": "la vista del informe muestra", "16": "para terminar una lista de" };
const IDS = Array.from({ length: 16 }, (_, i) => String(i + 1).padStart(2, "0"));
const I0 = {}; let cur = 0;
IDS.forEach(id => { let i = find(words(INI[id]), cur, WS.length); if (i < 0) { window.__avisos.push("inicio no hallado: " + id); i = cur; } I0[id] = i; cur = i; });
const D = TM.duracion + 1.5;
const tIni = id => (TM.escenas && TM.escenas[id] !== undefined && I0[id] === undefined) ? TM.escenas[id] : WS[I0[id]].s;
function nextId(id) { const k = IDS.indexOf(id); return IDS[k + 1]; }
const tEnd = id => nextId(id) ? tIni(nextId(id)) : D;
function T(id, phrase, nth = 0) {
  const a = I0[id], b = nextId(id) ? I0[nextId(id)] : WS.length, ws = words(phrase);
  let i = find(ws, a, b, nth);
  if (i < 0 && ws.length >= 3) { for (let n = ws.length - 1; n >= 2 && i < 0; n--) for (let o = 0; o + n <= ws.length && i < 0; o++) i = find(ws.slice(o, o + n), a, b, nth); }
  if (i < 0) { window.__avisos.push(id + ": «" + phrase + "»"); return tIni(id) + 1; }
  (window.__pistas = window.__pistas || []).push({ id, phrase, t: +WS[i].s.toFixed(2), ctx: WS.slice(Math.max(a, i - 2), i + 5).map(w => w.n).join(" ") });
  return WS[i].s;
}

const tl = gsap.timeline({ paused: true, defaults: { ease: E } });
const IN = (sel, t, o = {}) => tl.fromTo(sel, { autoAlpha: 0, y: o.y ?? 26, x: o.x ?? 0, scale: o.s ?? 1 }, { autoAlpha: 1, y: 0, x: 0, scale: 1, duration: o.d ?? .55, ease: o.ease ?? E, stagger: o.st ?? 0 }, t);
const DIM = (sel, t, to = .5) => tl.fromTo(sel, { opacity: 1 }, { opacity: to, duration: .4, ease: "power2.out" }, t);
const LINE = (sel, t, o = {}) => tl.fromTo(sel + " > span", { yPercent: 110 }, { yPercent: 0, duration: o.d ?? .75, ease: E, stagger: o.st ?? .09 }, t);

/* ---------- capturas con cámara y llamadas ---------- */
function camKeys(el, f, r, keys, id) {
  const [, , FW, FH] = f, IW = FW, IH = FW * r;
  const pos = (s, fx, fy) => ({ scale: s, x: Math.min(0, Math.max(FW - IW * s, FW / 2 - fx * IW * s)), y: Math.min(0, Math.max(FH - IH * s, FH / 2 - fy * IH * s)) });

  tl.set(el, { transformOrigin: "0 0", ...prev }, 0);
  keys.forEach(([cue, s, fx, fy]) => {
    const t = typeof cue === "number" ? cue : T(id, cue) - .3, to = pos(s, fx, fy);
    tl.fromTo(el, prev, { ...to, duration: .9, ease: "power3.inOut", immediateRender: false }, t);
    prev = to;
  });
}
function callout(host, [l, t, w, h], label, at, until, cls = "") {
  const el = document.createElement("div");
  el.className = "co " + cls + (t < 6 ? " in-b" : ""); el.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;
  if (label) el.innerHTML = "<i>" + label + "</i>";
  host.appendChild(el);
  tl.fromTo(el, { autoAlpha: 0, scale: .97 }, { autoAlpha: 1, scale: 1, duration: .4, ease: E }, at);
  if (until) tl.to(el, { autoAlpha: 0, duration: .3, ease: "power2.in" }, until);
}
function buildLayers(sc, id, layers) {
  const starts = layers.map((L, k) => L.from ? T(id, L.from) - .3 : tIni(id) + .4);

    const [x, y, w, h] = L.f, fr = document.createElement("div");
    fr.className = "frame"; fr.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    fr.innerHTML = `<div class="in"><img src="img/${L.src}.jpg" alt=""></div>`;
    sc.appendChild(fr);
    const inn = $(".in", fr), t0 = starts[k];
    let tEndL = tEnd(id) + .1;
    for (let j = k + 1; j < layers.length; j++) if (!layers[j].over) { tEndL = starts[j] + .15; break; }
    if (k === 0 && !L.from) IN(fr, t0, { y: 40, s: .98, d: .8 });
    else tl.fromTo(fr, { autoAlpha: 0, scale: .985 }, { autoAlpha: 1, scale: 1, duration: .45, ease: E }, t0);
    if (tEndL < tEnd(id)) tl.to(fr, { autoAlpha: 0, duration: .35, ease: "power2.in" }, tEndL);
    if (L.cam) camKeys(inn, L.f, L.r, L.cam, id);
    const cos = L.co || [];
    cos.forEach(([rect, label, cue, cls], i) => {
      const at = T(id, cue) - .2;
      if (i > 0 && at < T(id, cos[i - 1][2]) - .2) window.__avisos.push(id + ": llamada fuera de orden («" + cue + "»)");
      let until = tEndL - .05; const nx = cos[i + 1]; if (nx) until = Math.min(until, T(id, nx[2]) - .1);
      callout(inn, rect, label, at, until, cls || "");
    });
  });
}
function buildItems(sc, id, items, pos) {
  const ol = document.createElement("ol"); ol.className = "stl"; ol.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${pos.w}px`;
  ol.innerHTML = items.map((it, i) => `<li><i>${i + 1}</i><div><b>${it[0]}</b>${it[2] ? `<small>${it[2]}</small>` : ""}</div></li>`).join("");
  sc.appendChild(ol);
  const li = $$("li", ol);
  let prevT = -1;
  li.forEach((el, i) => { const t = T(id, items[i][1]) - .15; if (t < prevT) window.__avisos.push(id + ": ítem " + (i + 1) + " fuera de orden («" + items[i][1] + "»)"); prevT = t; IN(el, t, { y: 22, d: .5 }); if (i > 0) DIM(li[i - 1], t + .05, .5); });
}

  const t0 = tIni(id) + .15; IN(k, t0, { y: 14 }); LINE("#s" + id + " h2 .ln", t0 + .1);

function foot(sc, id) { const f = document.createElement("div"); f.className = "ft"; f.innerHTML = `<span>Guía del Gestor · Informe de Gestión 2026</span><span>${id} / 16</span>`; sc.appendChild(f); const lg = document.createElement("img"); lg.className = "logo"; lg.src = sc.classList.contains("navy") ? "img/logo-udes-blanco.png" : "img/logo-udes.svg"; sc.insertBefore(lg, sc.firstChild); }

    tl.fromTo(el, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: WIPE, ease: "power4.inOut" }, t);
    tl.set("#s" + IDS[i - 1], { autoAlpha: 0 }, t + WIPE + .05);
  }
});
tl.to("#bar", { scaleX: 1, duration: D, ease: "none" }, 0);
tl.to({}, { duration: .01 }, D);

/* ---------- control: render (seek) y vista previa (audio) ---------- */
window.__dur = D;
window.__seek = t => { tl.time(Math.max(0, Math.min(D, t)), false); return t; };
window.__ready = document.fonts.ready.then(() => Promise.all($$("img").map(i => i.decode ? i.decode().catch(() => {}) : 0))).then(() => true);
if (window.__avisos.length) console.warn("PISTAS SIN HALLAR (" + window.__avisos.length + "):\n" + window.__avisos.join("\n"));
const q = new URLSearchParams(location.search);
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $("#stage").style.transform = q.has("render") ? "none" : `scale(${s})`; }
addEventListener("resize", fit); fit();
tl.time(+(q.get("t") || 0));
if (!q.has("render")) {
  const a = $("#aud"); let playing = false;
  const tick = () => { if (playing) tl.time(Math.min(D, a.currentTime)); requestAnimationFrame(tick); }; tick();
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); playing = !playing; if (playing) { a.currentTime = tl.time(); a.play(); } else a.pause(); }
    if (e.code === "ArrowRight") { a.currentTime = Math.min(D, tl.time() + 5); tl.time(a.currentTime); }
    if (e.code === "ArrowLeft") { a.currentTime = Math.max(0, tl.time() - 5); tl.time(a.currentTime); }
  });
}
