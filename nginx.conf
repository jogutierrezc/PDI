server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos con hash: se pueden guardar para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Pilo se movió a /pilo-svg/ (las caras y el cuerpo entero). Los correos ya enviados y las apps
  # instaladas piden la ruta vieja: se redirigen para que lo sigan viendo.
  location ~ ^/(pilo-face|Pilo2)/(.*)$ {
    return 301 /pilo-svg/$1/$2;
  }

  # Equivale al rewrite de vercel.json: cualquier ruta sin extensión cae en la SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
