# Plantilla de nginx: la imagen oficial sustituye ${SUPABASE_ORIGIN} al arrancar
# (ver Dockerfile). Solo reemplaza variables de entorno definidas; $uri, $1…
# se quedan como están.

# Tipo con que se entrega cada archivo de un microportal, según su extensión.
# El almacenamiento no siempre lo conserva (entrega .html como texto), así que
# se fija aquí.
map $uri $portal_type {
  default                       "application/octet-stream";
  ~*/$                          "text/html; charset=utf-8";
  ~*\.html?$                    "text/html; charset=utf-8";
  ~*\.css$                      "text/css; charset=utf-8";
  ~*\.m?js$                     "text/javascript; charset=utf-8";
  ~*\.(json|map)$               "application/json";
  ~*\.geojson$                  "application/geo+json";
  ~*\.webmanifest$              "application/manifest+json";
  ~*\.xml$                      "application/xml";
  ~*\.(txt|bib|ya?ml)$          "text/plain; charset=utf-8";
  ~*\.csv$                      "text/csv; charset=utf-8";
  ~*\.md$                       "text/markdown; charset=utf-8";
  ~*\.svg$                      "image/svg+xml";
  ~*\.png$                      "image/png";
  ~*\.jpe?g$                    "image/jpeg";
  ~*\.gif$                      "image/gif";
  ~*\.webp$                     "image/webp";
  ~*\.avif$                     "image/avif";
  ~*\.ico$                      "image/x-icon";
  ~*\.woff2$                    "font/woff2";
  ~*\.woff$                     "font/woff";
  ~*\.ttf$                      "font/ttf";
  ~*\.otf$                      "font/otf";
  ~*\.eot$                      "application/vnd.ms-fontobject";
  ~*\.mp3$                      "audio/mpeg";
  ~*\.wav$                      "audio/wav";
  ~*\.ogg$                      "audio/ogg";
  ~*\.m4a$                      "audio/mp4";
  ~*\.mp4$                      "video/mp4";
  ~*\.webm$                     "video/webm";
  ~*\.pdf$                      "application/pdf";
  ~*\.wasm$                     "application/wasm";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/geo+json image/svg+xml text/csv;

  # Archivos con hash: se pueden guardar para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Microportales (Documentos): sitios ya renderizados, subidos en .zip al bucket
  # «documentos» bajo portales/<carpeta>/. /portales/<carpeta>/<archivo> lee ese
  # archivo y lo entrega con su tipo correcto.
  #
  # Seguridad: la política «sandbox» deja al sitio sin origen propio con acceso
  # a esta página: no puede leer la sesión ni el almacenamiento del portal, ni
  # abierto solo ni dentro del visor. El «Allow-Origin: *» es para que ese sitio
  # aislado pueda pedir sus propios datos (json, geojson, fuentes).
  location ^~ /portales/ {
    rewrite ^/portales/(.*/)$ /storage/v1/object/public/documentos/portales/${1}index.html break;
    rewrite ^/portales/(.*)$ /storage/v1/object/public/documentos/portales/${1} break;
    proxy_pass ${SUPABASE_ORIGIN};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Content-Type $portal_type always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Equivale al rewrite de vercel.json: cualquier ruta sin extensión cae en la SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
